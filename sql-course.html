<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Un spațiu de studiu pentru programare și limbi străine. Înțelege teoria, exersează și revino la ce ai învățat.">
  <title>PolymathHub · Jurnalul tău de studiu</title>
  <link rel="stylesheet" href="sql-course.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body class="learning-app">
  <a class="skip-link" href="#main-content">Sari la conținut</a>
  <header class="app-header">
    <button class="icon-button explore-toggle" id="explore-button" type="button" aria-label="Experimentează" aria-haspopup="dialog" aria-controls="explore-drawer">
      <img src="assets/icons/list.svg" alt="">
    </button>
    <a class="wordmark" href="#acasa" aria-label="PolymathHub — Acasă">Polymath<span>Hub</span></a>
    <div id="header-context" class="header-context"></div>
    <nav id="global-nav" aria-label="Navigație principală"><a href="#acasa">Acasă</a><a href="#cursuri">Cursuri</a><a href="#greseli">Greșelile mele</a><a href="#progres">Progres</a></nav>
    <div class="header-tools"><button id="outline-button" class="icon-button" aria-label="Deschide cuprinsul" hidden><img src="assets/icons/list.svg" alt=""></button><button type="button" class="domain-meter" id="domain-meter" aria-label="Progres pe domenii" aria-haspopup="dialog"><span aria-hidden="true">-</span></button><button type="button" class="inbox-trigger" data-open-inbox aria-haspopup="dialog" aria-label="Notificări" title="Notificări" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 20a2.2 2.2 0 0 0 4 0"/></svg><span data-inbox-count aria-hidden="true"></span></button><div id="account-control"><button type="button" class="account-button account-avatar" data-open-account aria-haspopup="dialog" aria-label="Deschide profilul" title="Deschide profilul"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button></div></div>
  </header>
  <button type="button" class="feedback-trigger" data-open-feedback aria-label="Trimite feedback" aria-haspopup="dialog" title="Trimite feedback"><svg width="20" height="30" viewBox="0 0 20 30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 5 2.5 3m5.5-3-2.5 3M6 13h8m-4 3v6M5.5 14 2 11m3 6H1.5m4.3 3.5L2.5 24m12-10 3.5-3m-3 6h3.5m-4.3 3.5 3.3 3.5"/><rect x="5" y="8" width="10" height="16" rx="5"/></svg></button>
  <aside id="learning-rail" class="learning-rail" aria-label="Traseul cursului" hidden></aside>
  <main id="main-content" tabindex="-1"><p class="loading-message" role="status">Pregătim spațiul tău de studiu…</p></main>
  <footer id="app-footer" class="app-footer">PolymathHub · Învață în ritmul tău. <button class="feedback-menu" type="button" data-open-feedback aria-haspopup="dialog">Trimite feedback</button></footer>
  <div id="sql-toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="course-dialog" class="outline-dialog" aria-label="Cuprinsul cursului"><button class="dialog-close" data-close-dialog aria-label="Închide cuprinsul">×</button><div id="mobile-outline" class="dialog-heading" tabindex="-1" autofocus></div></dialog>
  <script src="sql-catalog.js"></script><script src="sql-explore.js"></script>
  <script src="sql-progress.js"></script><script src="language-practice.js"></script><script src="study-overview.js"></script>
  <script src="sql-course.js"></script><script src="profile-avatars.js"></script><script src="profile-patterns.js"></script><script src="scroll-nav.js"></script><script src="inbox.js"></script><script src="account.js"></script><script src="domain-meter.js"></script>
</body>
</html>
