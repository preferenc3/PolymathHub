<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratoare SQL · PolymathHub</title>
  <link rel="stylesheet" href="sql-course.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="sql-university.css">
</head>
<body class="learning-app university">
  <a class="skip-link" href="#university-main">Sari la conținut</a>
  <header class="app-header">
    <button class="icon-button explore-toggle" id="explore-button" type="button" aria-label="Experimentează" aria-haspopup="dialog" aria-controls="explore-drawer">
      <img src="assets/icons/list.svg" alt="">
    </button>
    <a class="wordmark" href="/" aria-label="PolymathHub — Acasă">Polymath<span>Hub</span></a>
    <nav aria-label="Domenii">
      <a href="/sql-university.html" aria-current="page">SQL</a>
      <a href="/#cursuri?domeniu=limbi">Alte domenii</a>
    </nav>
  </header>
  <main class="university-main" id="university-main">
    <section class="lab-masthead" aria-labelledby="lab-title">
      <div class="university-heading">
        <h1 id="lab-title">Laboratoare <span>SQL</span></h1>
        <a class="lab-foundations" href="/#cursuri?domeniu=sql">Bazele SQL <span aria-hidden="true">↗</span></a>
      </div>
    </section>
    <div class="lab-layout">
      <aside class="lab-picker" aria-label="Alegerea laboratorului și a exercițiului">
        <button type="button" class="picker-toggle secondary" id="picker-toggle" aria-expanded="false" aria-controls="picker-content">Schimbă exercițiul <span aria-hidden="true">⌄</span></button>
        <div id="picker-content">
          <nav class="lab-modes" aria-label="Mod de lucru">
            <button id="mode-exercises" type="button" aria-pressed="true"><img src="assets/icons/list.svg" alt="">Exerciții</button>
            <button id="mode-console" type="button" aria-pressed="false"><img src="assets/icons/code.svg" alt="">Consolă liberă</button>
          </nav>
          <div class="lab-controls">
            <label for="lab-select">Laborator
              <select id="lab-select" disabled>
                <option value="4">Lab 4 · Structură și modificări</option>
                <option value="5">Lab 5 · Interogări</option>
              </select>
            </label>
            <label class="lab-compact-choice" for="exercise-select">Exercițiu
              <select id="exercise-select" disabled></select>
            </label>
            <nav id="lab-task-list" aria-label="Sarcinile laboratorului"></nav>
          </div>
        </div>
      </aside>
      <div class="lab-workspace">
        <p id="lab-status" role="status">Se încarcă exercițiile…</p>
        <button id="retry-catalog" class="secondary" type="button" hidden>Reîncearcă</button>
        <section id="exercise-workspace" hidden>
          <section id="terminal-panel" aria-labelledby="exercise-title">
            <header class="university-task">
              <div><h2 id="exercise-title" tabindex="-1"></h2><p id="exercise-prompt"></p></div>
            </header>
            <div class="sql-workbench">
              <details id="terminal-schema" class="terminal-schema">
                <summary>Tabele și coloane</summary>
                <div class="terminal-schema-body">
                  <p id="schema-guidance">Deschide un tabel pentru coloane și date.</p>
                  <p id="tables-status" role="status"></p>
                  <div id="schema-table-list"></div>
                </div>
              </details>
              <div class="sql-workbench-editor">
            <form id="terminal-form">
              <div class="editor-frame university-terminal">
                <div class="editor-caption"><label for="terminal-input">Terminal SQLite</label><button type="button" id="jump-to-schema">Tabele</button><small>Ctrl/⌘ + Enter</small></div>
                <div class="terminal-input-line">
                  <textarea id="terminal-input" rows="8" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" maxlength="12000" placeholder="Scrie comanda SQL aici…"></textarea>
                </div>
              </div>
              <div class="editor-actions">
                <button class="secondary" id="run-command" type="submit">Rulează</button>
                <button class="primary" id="check-answer" type="submit">Verifică răspunsul</button>
                <button class="secondary" id="show-hint" type="button" aria-expanded="false" aria-controls="university-hint">Indiciu</button>
                <button class="text-button" id="show-solution" type="button" aria-expanded="false" aria-controls="university-solution" hidden>Vezi soluția</button>
                <button class="text-button" id="reset-terminal" type="button">Curăță terminalul</button>
              </div>
            </form>
            <p id="university-hint" class="hint-content" hidden></p>
            <p id="university-feedback" role="status" aria-live="polite"></p>
            <pre id="university-solution" hidden></pre>
            <section id="university-results" aria-label="Rezultate"></section>
              </div>
            </div>
          </section>
          <nav class="lab-pagination" aria-label="Navigare între exerciții">
            <button class="secondary" id="previous-exercise" type="button">← Anteriorul</button>
            <button class="secondary" id="next-university-exercise" type="button">Următorul →</button>
          </nav>
        </section>
      </div>
    </div>
  </main>
  <script src="sql-catalog.js"></script><script src="sql-explore.js"></script>
  <script src="study-overview.js"></script>
  <script src="sql-university.js"></script>
</body>
</html>
